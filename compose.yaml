name: puffx-ai-image-generator

services:
  puffx-ai-image-generator:
    image: ghcr.io/puffxhost/offline-ai-image-generator:latest
    build: .
    pull_policy: missing
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      HOST: "0.0.0.0"
      PORT: "7860"
      MODEL_ROOT: "/models"
      OUTPUT_DIR: "/outputs"
    volumes:
      - ./models:/models
      - ./outputs:/outputs
